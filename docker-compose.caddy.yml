# Reverse proxy on ports 80/443. Combine with demo overlay for public URLs.
#
# HTTP-by-IP (until DNS exists):
#   export DEMO_WEB_URL=http://<public-ip>
#   export DEMO_API_URL=/api/v1
#   export DEMO_AUTH_URL=http://<public-ip>
#   export PUBLIC_ORIGIN=http://<public-ip>
#
# HTTPS for permitwiseai.cloud (DNS A/AAAA + www CNAME already at this host):
#   export CADDY_SITES="permitwiseai.cloud, www.permitwiseai.cloud, :80"
#   export PUBLIC_ORIGIN=https://permitwiseai.cloud
#   export DEMO_WEB_URL=https://permitwiseai.cloud
#   export DEMO_API_URL=/api/v1
#   export DEMO_AUTH_URL=https://permitwiseai.cloud
#   export APP_PUBLIC_URL=https://permitwiseai.cloud
#   export MINIO_PUBLIC_URL=https://permitwiseai.cloud
#   export CORS_ORIGIN=https://permitwiseai.cloud,http://<public-ip>
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.caddy.yml up -d --build
#
# Caddy issues Let's Encrypt certs for names in CADDY_SITES (except :80).
# Keep :80 so the bare IP still answers over HTTP. Rebuild frontend so
# NEXT_PUBLIC_* pick up DEMO_WEB_URL.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITES: ${CADDY_SITES:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  api:
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      SECURITY_TRUST_PROXY: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1}}
      # Evidence links go through Caddy (/ptw-documents/*) to MinIO.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1}}
      CORS_ORIGIN: ${CORS_ORIGIN:-${DEMO_WEB_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1}}}

  keycloak:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-http://127.0.0.1}

  # Only Caddy (80/443) is public. The rest listen on the server itself; use an SSH tunnel,
  # e.g. ssh -L 8080:127.0.0.1:8080 root@<server> for the Keycloak console.
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  mailpit:
    ports: !override
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  loki:
    ports: !override
      - "127.0.0.1:3100:3100"
  metabase:
    ports: !override
      - "127.0.0.1:3001:3000"
  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"

volumes:
  caddy_data:
  caddy_config:
