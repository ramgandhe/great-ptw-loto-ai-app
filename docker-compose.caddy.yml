# Reverse proxy on port 80. Combine with demo overlay for public URLs:
#
#   export DEMO_WEB_URL=http://<public-ip>
#   export DEMO_API_URL=/api/v1   # same address as the page, so the IP and any domain both work
#   export DEMO_AUTH_URL=http://<public-ip>
#   export PUBLIC_ORIGIN=http://<public-ip>
#   HTTPS for a domain: CADDY_SITES="example.com, :80" and MINIO_PUBLIC_URL=https://example.com
#   (APP_PUBLIC_URL=https://example.com for emailed links; leave PUBLIC_ORIGIN, it is the sign-in issuer)
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.caddy.yml up -d --build
#
# When a domain is ready, point DNS here, change PUBLIC_ORIGIN / DEMO_* to https://...
# and update Caddyfile site addresses.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITES: ${CADDY_SITES:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  api:
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      SECURITY_TRUST_PROXY: "true"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1}}
      # Evidence links go through Caddy (/ptw-documents/*) to MinIO.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-${PUBLIC_ORIGIN:-http://127.0.0.1}}

  keycloak:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${PUBLIC_ORIGIN:-http://127.0.0.1}

  # Only Caddy (80/443) is public. The rest listen on the server itself; use an SSH tunnel,
  # e.g. ssh -L 8080:127.0.0.1:8080 root@<server> for the Keycloak console.
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  mailpit:
    ports: !override
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  loki:
    ports: !override
      - "127.0.0.1:3100:3100"
  frontend:
    ports: !override
      - "127.0.0.1:3000:3000"

volumes:
  caddy_data:
  caddy_config:
