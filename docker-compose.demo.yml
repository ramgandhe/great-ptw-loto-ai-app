# Demo overlay — public HTTP demo on a single host (no TLS).
# Usage:
#   export DEMO_WEB_URL=http://203.0.113.10:3000
#   export DEMO_API_URL=http://203.0.113.10:4000/api/v1
#   export DEMO_AUTH_URL=http://203.0.113.10:8080
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build api frontend

services:
  api:
    environment:
      CORS_ORIGIN: ${DEMO_WEB_URL:?DEMO_WEB_URL is required}
      KEYCLOAK_ISSUER: ${DEMO_AUTH_URL:?DEMO_AUTH_URL is required}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${DEMO_API_URL:?DEMO_API_URL is required}
        NEXT_PUBLIC_APP_URL: ${DEMO_WEB_URL:?DEMO_WEB_URL is required}
        NEXT_PUBLIC_KEYCLOAK_URL: ${DEMO_AUTH_URL:?DEMO_AUTH_URL is required}
        NEXT_PUBLIC_KEYCLOAK_REALM: ptw-platform
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ptw-web
