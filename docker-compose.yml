services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ptw
      POSTGRES_PASSWORD: ptw_dev_password
      POSTGRES_DB: ptw_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptw -d ptw_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ptw_minio
      MINIO_ROOT_PASSWORD: ptw_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ptw_platform
      KC_DB_USERNAME: ptw
      KC_DB_PASSWORD: ptw_dev_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  metabase:
    image: metabase/metabase:v0.50.13
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ptw_platform
      MB_DB_PORT: 5432
      MB_DB_USER: ptw
      MB_DB_PASS: ptw_dev_password
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://ptw:ptw_dev_password@postgres:5432/ptw_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      # Credentials come from the environment (see .env.example); dev fallbacks
      # match the local minio service and are never production secrets.
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ptw_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ptw_minio_password}
      MINIO_BUCKET: ptw-documents
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ptw-platform
      LOKI_URL: http://loki:3100
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(b=>process.exit(b.status==='unhealthy'?1:0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
