# Render Blueprint — PTW/LOTO demo stack
# Dashboard: New → Blueprint → connect this repo → apply
#
# Public URLs (after deploy):
#   Web:  https://ptw-loto-web.onrender.com
#   API:  https://ptw-loto-api.onrender.com
#   Auth: https://ptw-loto-auth.onrender.com
# Login: admin@ptw.local / admin
#
# Note: free-tier web services sleep when idle; first request can take ~1 min.
# Postgres/Redis may require a paid plan depending on your Render account.

services:
  - type: keyvalue
    name: ptw-loto-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ptw-loto-auth
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infrastructure/render/Dockerfile.keycloak
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HOSTNAME
        value: ptw-loto-auth.onrender.com
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded

  - type: web
    name: ptw-loto-minio
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infrastructure/render/Dockerfile.minio
    dockerContext: .
    disk:
      name: ptw-loto-minio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MINIO_ROOT_USER
        value: ptw_render_minio
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: ptw-loto-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infrastructure/render/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURITY_TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ptw-loto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ptw-loto-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: ptw-loto-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: ptw-loto-redis
          property: port
      - key: MINIO_ENDPOINT
        value: ptw-loto-minio.onrender.com
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_ACCESS_KEY
        value: ptw_render_minio
      - key: MINIO_SECRET_KEY
        fromService:
          type: web
          name: ptw-loto-minio
          envVarKey: MINIO_ROOT_PASSWORD
      - key: MINIO_BUCKET
        value: ptw-documents
      - key: KEYCLOAK_URL
        value: https://ptw-loto-auth.onrender.com
      - key: KEYCLOAK_ISSUER
        value: https://ptw-loto-auth.onrender.com
      - key: KEYCLOAK_REALM
        value: ptw-platform
      - key: KEYCLOAK_CLIENT_ID
        value: ptw-api
      - key: CORS_ORIGIN
        value: https://ptw-loto-web.onrender.com
      - key: LOKI_URL
        value: http://127.0.0.1:3100

  - type: web
    name: ptw-loto-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ptw-loto-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://ptw-loto-web.onrender.com
      - key: NEXT_PUBLIC_KEYCLOAK_URL
        value: https://ptw-loto-auth.onrender.com
      - key: NEXT_PUBLIC_KEYCLOAK_REALM
        value: ptw-platform
      - key: NEXT_PUBLIC_KEYCLOAK_CLIENT_ID
        value: ptw-web

databases:
  - name: ptw-loto-db
    plan: basic-256mb
    region: oregon
    databaseName: ptw_platform
    user: ptw
